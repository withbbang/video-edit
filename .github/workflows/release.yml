# 태그(v*)를 push 하면 맥 dmg 와 윈도우 설치 파일을 빌드해 GitHub 릴리스 "초안(draft)" 에 올린다.
# 초안은 앱의 업데이트 확인(app/updates.py, releases/latest)에 잡히지 않는다. 확인한 뒤 GitHub 에서 직접 공개한다.
#
#   태그 = v<app/__init__.py 의 __version__>      예) v0.1.0         → 정식 릴리스 초안
#        = v<__version__>-<접미사>                예) v0.1.0-rc1     → prerelease 초안 (업데이트 확인이 무시)
#   태그와 __version__ 이 다르면 실패한다 (packaging/release_version.py).
#
# 자산: youtube-edit-<ver>-mac-arm64.dmg, youtube-edit-<ver>-win-x64-setup.exe (app/updates.py 가 찾는 이름),
#       ffmpeg 정적 빌드의 GPL 대응 소스(packaging/fetch_ffmpeg.py GPL_SOURCES), SHA256SUMS.txt
# 서드파티 액션은 모두 커밋 SHA 로 고정한다 (주석은 그 커밋의 태그).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

defaults:
  run:
    shell: bash

jobs:
  mac:
    name: macOS arm64 dmg
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64

      - name: 태그와 __version__ 비교
        id: ver
        run: python packaging/release_version.py "$GITHUB_REF_NAME"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-app.txt
          python -c "import platform; assert platform.machine() == 'arm64', platform.machine()"

      - name: pytest
        run: python -m pytest -q

      - name: ffmpeg 받기·확인 (실행해서 필터·인코더·정적 링크 확인)
        run: |
          python packaging/fetch_ffmpeg.py --platform mac --dest packaging/bin
          git diff --exit-code -- packaging/THIRD_PARTY.txt

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm packaging/youtube-edit.spec

      - name: 묶은 실행 파일 확인 (창 없이)
        run: python packaging/smoke_frozen.py dist/youtube-edit.app/Contents/MacOS/youtube-edit

      - name: dmg
        env:
          DMG: ${{ steps.ver.outputs.dmg }}
        run: |
          bash packaging/macos/make_dmg.sh dist/youtube-edit.app "dist/$DMG"
          shasum -a 256 "dist/$DMG"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: dist/${{ steps.ver.outputs.dmg }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  win:
    name: Windows x64 setup
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
      INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: 태그와 __version__ 비교
        id: ver
        run: python packaging/release_version.py "$GITHUB_REF_NAME"

      - name: 의존성 설치 (torch 는 CPU 판)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-app.txt
          python -c "import torch; assert torch.version.cuda is None, torch.__version__; print('torch', torch.__version__)"

      - name: pytest
        run: python -m pytest -q

      - name: ffmpeg 받기·확인 (ffmpeg.exe 를 실행해서 필터·인코더 확인)
        run: |
          python packaging/fetch_ffmpeg.py --platform win --dest packaging/bin
          git diff --exit-code -- packaging/THIRD_PARTY.txt

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm packaging/youtube-edit.spec

      - name: 묶은 실행 파일 확인 (창 없는 exe 의 -c Traceback, --pipeline --help, 묶인 ffmpeg)
        run: python packaging/smoke_frozen.py dist/youtube-edit/youtube-edit.exe

      - name: Inno Setup 6.7.3 설치 (sha256 확인)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $exe
          $got = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          if ($got -ne $env:INNO_SHA256) { throw "Inno Setup sha256 불일치: $got" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$dir`"")
          if ($p.ExitCode -ne 0) { throw "Inno Setup 설치 실패: $($p.ExitCode)" }
          foreach ($f in 'ISCC.exe', 'Languages\Korean.isl') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f 가 없습니다" }
          }
          "ISCC=$(Join-Path $dir 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 설치 파일 (iscc)
        shell: pwsh
        env:
          VER: ${{ steps.ver.outputs.version }}
          SETUP: ${{ steps.ver.outputs.setup }}
        run: |
          & $env:ISCC "/DAppVersion=$env:VER" 'packaging\windows\installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "iscc 실패: $LASTEXITCODE" }
          $out = Join-Path 'dist' $env:SETUP
          if (-not (Test-Path $out)) { throw "$out 가 없습니다" }
          Get-FileHash -Algorithm SHA256 $out | Format-List

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win
          path: dist/${{ steps.ver.outputs.setup }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sources:
    name: GPL 대응 소스 (ffmpeg·x264·x265)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 태그와 __version__ 비교
        run: python packaging/release_version.py "$GITHUB_REF_NAME"

      - name: 소스 아카이브 받기 (sha256 확인)
        run: python packaging/fetch_ffmpeg.py --sources dist/sources

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: dist/sources/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: GitHub 릴리스 (초안)
    needs: [mac, win, sources]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 태그와 __version__ 비교, 릴리스 노트
        id: ver
        run: python packaging/release_version.py "$GITHUB_REF_NAME" --notes-out dist/release-notes.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/assets
          merge-multiple: true

      - name: 자산 확인, SHA256SUMS
        env:
          DMG: ${{ steps.ver.outputs.dmg }}
          SETUP: ${{ steps.ver.outputs.setup }}
        run: |
          cd dist/assets
          ls -la
          test -s "$DMG"
          test -s "$SETUP"
          python - <<'EOF'
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location("ff", "../../packaging/fetch_ffmpeg.py")
          ff = importlib.util.module_from_spec(spec); spec.loader.exec_module(ff)
          for s in ff.GPL_SOURCES:
              p = pathlib.Path(s["name"])
              assert p.is_file() and ff.sha256_of(p) == s["sha256"], s["name"]
          EOF
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: youtube-edit ${{ github.ref_name }}
          body_path: dist/release-notes.md
          draft: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/assets/${{ steps.ver.outputs.dmg }}
            dist/assets/${{ steps.ver.outputs.setup }}
            dist/assets/ffmpeg-*.tar.xz
            dist/assets/x264-*.tar.bz2
            dist/assets/x265_*.tar.gz
            dist/assets/SHA256SUMS.txt
